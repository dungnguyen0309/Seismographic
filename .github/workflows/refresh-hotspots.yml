# Saves the Hotspots data (UCDP candidate events and GDELT conflict-news volume) to data/snapshot/hotspots_* and
# rebuilds the site's data/hotspots/ from it, in a temporary folder that is committed only if every check passes.
# Runs every morning; you can also run it from the Actions tab ("Run workflow").
name: Refresh hotspots

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

# shared by the three refresh workflows, so two of them never push at the same time
concurrency:
  group: data-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # GDELT is slow at times: 80 paced requests, each with one retry; then the site checks
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # the branch tip at start, not the commit a queued run was triggered on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download the latest hotspots data
        run: python scripts/refresh_hotspots.py
      - name: Check the app still works with the new data  # if this fails, nothing is committed
        run: |
          pip install pytest httpx
          python -m pytest -q
      - name: Rebuild the site's hotspots data and check it  # if this fails, nothing is committed
        run: bash scripts/refresh_web.sh --only hotspots --fixtures  # fixtures: the group9 JS test checks the hotspots data
      - name: Commit the hotspots data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot/hotspots_* web
          git diff --cached --quiet && exit 0
          git commit -m "Refresh hotspots data"
          git pull --rebase
          git push
      - name: Open an issue  # one per workflow: skipped while one is open
        if: failure() || cancelled()  # a timeout cancels the job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Data refresh failed: ${{ github.workflow }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json title --jq 'map(select(.title == env.TITLE)) | length')
          if [ "$open" = 0 ]; then
            gh issue create --title "$TITLE" --body "Nothing was committed, so the site keeps the last good data. Log: $RUN"
          fi
      - name: Keep the scheduled workflows enabled  # GitHub turns schedules off after 60 days without activity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in $(grep -l '^  schedule:' .github/workflows/*.yml); do
            api="repos/$GITHUB_REPOSITORY/actions/workflows/$(basename "$wf")"
            # a workflow switched off by hand stays off (uptime.yml until the site is live)
            [ "$(gh api "$api" --jq .state)" = disabled_manually ] && continue
            gh api -X PUT "$api/enable" || echo "could not enable $wf"  # what gh workflow enable calls
          done
