# Runs the tests on every push and pull request: the scoring model, the analysis helpers, the PDF brief, and every
# page and country tab of the app (using the saved data snapshot), then the static site's JS tests, its checks
# (python -m staticbuild.validate) and a smoke test of every route in headless Chrome. A red cross on a commit means something broke.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # pytest, then the JS tests and the smoke test (38 page loads)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Run the tests
        run: python -m pytest -q
      - name: Run the JS tests
        run: node --test web/tests/*.test.mjs
      - name: Check the built site
        run: python -m staticbuild.validate
      - name: Open every route in headless Chrome
        run: |
          python scripts/serve_web.py --root web --port 8650 > /dev/null &
          for _ in $(seq 50); do curl -fso /dev/null http://127.0.0.1:8650/ && break; sleep 0.2; done
          node scripts/smoke_web.mjs --base http://127.0.0.1:8650
