[theme]
base = "dark"
# The interface accent is ink, not a hue: every hue in the app belongs to the data (prm/config.py INK)
primaryColor = "#f4f3ee"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#ececec"
borderColor = "#2c2c2a"
linkColor = "#ececec"
# Change colours (prm/config.py INK better/worse): safer is blue, riskier is red, so st.metric deltas match the charts.
# Text on its background: blue 7.1:1, red 6.8:1.
greenColor = "#74b1fe"
greenTextColor = "#74b1fe"
greenBackgroundColor = "#12243a"
redColor = "#fd8078"
redTextColor = "#fd8078"
redBackgroundColor = "#331412"
# No change (a zero delta, or delta_color "off") in the warm greys (INK faint, muted, panel)
grayColor = "#8f8e87"
grayTextColor = "#a3a29a"
grayBackgroundColor = "#141414"
# Notes and warnings in the warm greys, warnings in amber; inline code in soft ink
blueTextColor = "#c3c2b7"
blueBackgroundColor = "#141414"
yellowTextColor = "#e19f3f"
yellowBackgroundColor = "#1c1810"
codeTextColor = "#c3c2b7"
font = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
headingFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"

[theme.sidebar]
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#1a1a19"

[client]
toolbarMode = "viewer"
# Visitors never see a stack trace: pages catch their own errors (ui.page_error_boundary); anything else shows only
# the error type. The full traceback still goes to the server log.
showErrorDetails = "type"

[global]
# Streamlit takes itself for a development checkout when its package is not under site-packages (Vercel bundles it
# in /var/task/_vendor), and then stops serving its own frontend: every page is a 404.
developmentMode = false

[server]
runOnSave = false
headless = true

[browser]
gatherUsageStats = false
