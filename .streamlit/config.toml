[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#ececec"
borderColor = "#2c2c2a"
linkColor = "#74b1fe"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#1a1a19"

[client]
toolbarMode = "viewer"
# Visitors never see a stack trace: pages catch their own errors (ui.page_error_boundary); anything else shows only
# the error type. The full traceback still goes to the server log.
showErrorDetails = "type"

[server]
runOnSave = false
headless = true

[browser]
gatherUsageStats = false
